# THE MCL STANDARD HOOK SET (`mcl-standard-hooks`), portable committed form,
# plus this repository's own `just lint` hook.
#
# metacraft-dev-guidelines/policies/repo-requirements.md §4 requires the whole
# set. This repository does not install it through the devops-modules flake,
# so §4.1 names the portable form: the block from devops-modules'
# `git-hooks/mcl-standard-hooks.yaml`, with `rev:` pinned to a devops-modules
# sha. Keep the membership identical to that file; when it gains a hook, so
# does this one.
#
# The flake provides the TOOLS (editorconfig-checker, nixfmt, prettier, prek,
# uv, and everything `just lint` runs); this file provides the RULES.
# `terraform-format` is a member of the set and stays here although this
# repository has no `*.tf` files: it runs only when one is added, and then it
# needs `tofu`, which the dev shell would have to gain at the same time.
#
# Install:  prek install --install-hooks     (or: pre-commit install)
# Run:      prek run --all-files
#
# ON NixOS, `uv` MUST BE ON PATH BEFORE EITHER OF THOSE; the dev shell puts it
# there. prek otherwise downloads its own `uv`, a generic-linux dynamically
# linked binary that cannot exec on NixOS, and every hook then fails to
# install. See repo-requirements.md §4.x.
#
# Both committed-binary hooks act on ADDED files only
# (`git diff --staged --diff-filter=A`), so they cannot retroactively fail a
# file already tracked. `--enforce-all` is deliberately not passed and must
# not be added to "tighten" it.

minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 1024 KB passed explicitly because UPSTREAM'S DEFAULT IS 500 KB; dropping
      # the argument silently halves the ceiling.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer

  - repo: https://github.com/metacraft-labs/devops-modules
    # Pinned to a sha, never to a branch: a hook set that changes under a repo
    # without a commit in that repo is a hook set nobody can bisect.
    rev: dbf9d87267c84c1eef10e0298ca264f5dfd825ee
    hooks:
      - id: ban-added-ct-recordings

  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        types: [file]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: terraform-format
        name: terraform-format
        description: Format Terraform/OpenTofu HCL files
        entry: tofu fmt
        language: system
        types: [file]
        files: \.(tf|tftest\.hcl)$

      - id: prettier
        name: prettier
        entry: prettier --check --list-different=false --log-level=warn --ignore-unknown --write
        language: system
        types: [text]

      # This repository's own gate (repo-requirements.md §4.2: per-repo by
      # nature, so not in the shared set). It runs on every commit whatever
      # the commit touches, because a change to a sibling the Nim checks read
      # can break this repository without touching a file in it.
      - id: lint
        name: just lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
